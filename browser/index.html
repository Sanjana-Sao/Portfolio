    /* scroll progress bar */
    #scroll-progress {
      position: fixed; top: 0; left: 0; height: 2px; z-index: 9999;
      background: linear-gradient(90deg, #00e5ff, #00ff88, #7c3aed);
      width: 0%; transition: width 0.1s linear;
      box-shadow: 0 0 8px rgba(0,229,255,0.8);
    }
  </style>
<style>*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}:root{--bg-primary:#060a0f;--bg-secondary:#0b1118;--bg-card:#0e1825;--bg-card-hover:#131f2e;--border:rgba(0, 229, 255, .07);--border-hover:rgba(0, 229, 255, .24);--accent-cyan:#00e5ff;--accent-teal:#00bcd4;--accent-green:#00ff88;--accent-purple:#7c3aed;--accent-blue:#3b82f6;--accent-pink:#f472b6;--text-primary:#e8f4f8;--text-secondary:#8a9ab0;--text-muted:#4a5568;--font-primary:"Space Grotesk", sans-serif;--font-mono:"JetBrains Mono", monospace;--glow-cyan:0 0 24px rgba(0, 229, 255, .4);--glow-cyan-lg:0 0 60px rgba(0, 229, 255, .18);--glow-green:0 0 24px rgba(0, 255, 136, .4);--glow-purple:0 0 24px rgba(124, 58, 237, .4);--nav-bg-scrolled:rgba(6, 10, 15, .96);--gradient-brand:linear-gradient(135deg, #00e5ff 0%, #00ff88 50%, #7c3aed 100%)}html{scroll-behavior:smooth}body{background-color:var(--bg-primary);color:var(--text-primary);font-family:var(--font-primary);line-height:1.6;overflow-x:hidden;transition:background-color .35s ease,color .35s ease}</style><link rel="stylesheet" href="styles-IO47LBAV.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="styles-IO47LBAV.css"></noscript></head>
<body>
  <div id="scroll-progress"></div>
  <app-root></app-root>
  <script>
    window.addEventListener('scroll', () => {
      const el = document.getElementById('scroll-progress');
      if (!el) return;
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      el.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
    });
  </script>
